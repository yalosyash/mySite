name: Update Linux Snapshots

# Эталоны скриншотов привязаны к платформе (win32/linux), а локально есть только
# Windows. Этот воркфлоу запускается вручную (Actions -> Run workflow) на
# ubuntu-latest, генерирует linux-эталоны и отдаёт их артефактом.
# Скачанный архив нужно распаковать в src/tests/mainPage.spec.ts-snapshots
# и закоммитить — после этого основной прогон тестов сравнивает с ними.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Тот же образ, что и в основном прогоне: эталоны должны сниматься в
    # том же окружении, иначе шрифты и рендеринг разойдутся. Иначе шаг
    # `install --with-deps` ставит через apt ~40 системных пакетов.
    # ВАЖНО: тег должен совпадать с версией @playwright/test в
    # package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update snapshots
        run: npx playwright test --grep "Скриншоты" --update-snapshots=all

      - uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: src/tests/mainPage.spec.ts-snapshots/*-linux.png
          retention-days: 30
          if-no-files-found: error
