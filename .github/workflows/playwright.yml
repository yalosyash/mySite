name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Официальный образ Playwright: браузеры и системные зависимости уже
    # внутри. Иначе шаг `playwright install --with-deps` каждый раз ставит
    # через apt ~40 пакетов (шрифты, xvfb, библиотеки), и прогон висит на
    # этом несколько минут. Плюс одинаковый рендеринг скриншотов.
    # ВАЖНО: тег образа должен совпадать с версией @playwright/test
    # в package-lock.json, иначе браузер не найдётся.
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
